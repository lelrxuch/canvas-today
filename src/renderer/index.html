<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Canvas Today</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="panel">
    <header class="titlebar">
      <div class="lights">
        <button class="light close" id="btn-close" title="Ocultar" aria-label="Ocultar">
          <svg viewBox="0 0 12 12"><path d="M3.5 3.5l5 5M8.5 3.5l-5 5"/></svg>
        </button>
        <button class="light min" id="btn-min" title="Minimizar" aria-label="Minimizar">
          <svg viewBox="0 0 12 12"><path d="M3 6h6"/></svg>
        </button>
        <button class="light pin" id="btn-pin" title="Mantener encima" aria-label="Mantener encima">
          <svg viewBox="0 0 12 12"><path d="M6 3v6M3 6h6"/></svg>
        </button>
      </div>
      <div class="title" id="title">Pendientes</div>
      <div class="tools">
        <button class="tool" id="btn-refresh" title="Actualizar" aria-label="Actualizar">
          <svg viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2"/></svg>
        </button>
        <button class="tool" id="btn-settings" title="Ajustes" aria-label="Ajustes">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <section class="view" id="view-list">
      <div class="summary" id="summary"></div>
      <div class="banner" id="banner" hidden>
        <span id="banner-text"></span>
        <button class="banner-btn" id="banner-btn" hidden></button>
      </div>
      <div class="list" id="list"></div>
    </section>

    <section class="view settings" id="view-settings" hidden>
      <form id="form" autocomplete="off">
        <h2 class="group-title">Conexión</h2>
        <div class="group">
          <label class="row stacked">
            <span class="label">Dirección de Canvas</span>
            <input type="text" name="baseUrl" placeholder="umg.instructure.com" spellcheck="false">
          </label>
          <label class="row stacked">
            <span class="label">Ruta de inicio de sesión</span>
            <input type="text" name="loginPath" placeholder="/login/saml" spellcheck="false">
          </label>
          <div class="row stacked">
            <span class="label">Token</span>
            <span class="hint" id="token-status"></span>
            <input type="password" name="token" placeholder="Pegar token nuevo (opcional)" spellcheck="false">
          </div>
          <label class="row">
            <span class="label">Vence el</span>
            <input type="date" name="tokenExpires">
          </label>
        </div>

        <h2 class="group-title">Pendientes</h2>
        <div class="group">
          <label class="row">
            <span class="label">Avisar antes de vencer</span>
            <select name="notifyHours">
              <option value="1">1 hora</option>
              <option value="3">3 horas</option>
              <option value="6">6 horas</option>
              <option value="12">12 horas</option>
              <option value="24">1 día</option>
            </select>
          </label>
          <label class="row">
            <span class="label">Mostrar los próximos</span>
            <select name="daysAhead">
              <option value="7">7 días</option>
              <option value="14">14 días</option>
              <option value="30">30 días</option>
            </select>
          </label>
          <label class="row">
            <span class="label">Actualizar cada</span>
            <select name="refreshMinutes">
              <option value="5">5 min</option>
              <option value="15">15 min</option>
              <option value="30">30 min</option>
              <option value="60">1 hora</option>
            </select>
          </label>
        </div>

        <h2 class="group-title">Ventana</h2>
        <div class="group">
          <div class="row">
            <span class="label">Apariencia</span>
            <div class="segmented" role="radiogroup">
              <label><input type="radio" name="theme" value="system"><span>Sistema</span></label>
              <label><input type="radio" name="theme" value="light"><span>Claro</span></label>
              <label><input type="radio" name="theme" value="dark"><span>Oscuro</span></label>
            </div>
          </div>
          <label class="row">
            <span class="label">Opacidad</span>
            <input type="range" name="opacity" min="0.6" max="1" step="0.02">
          </label>
          <label class="row">
            <span class="label">Mantener encima</span>
            <input type="checkbox" class="switch" name="alwaysOnTop">
          </label>
          <label class="row">
            <span class="label">Iniciar con el sistema</span>
            <input type="checkbox" class="switch" name="autostart">
          </label>
        </div>

        <p class="form-error" id="form-error" hidden></p>

        <div class="form-actions">
          <button type="button" class="btn" id="btn-cancel">Cancelar</button>
          <button type="submit" class="btn primary" id="btn-save">Guardar</button>
        </div>
        <button type="button" class="quit" id="btn-quit">Salir de Canvas Today</button>
      </form>
    </section>

    <footer class="footer">
      <span id="updated"></span>
      <span class="chip" id="token-chip" hidden></span>
      <button class="link" id="btn-login">Iniciar sesión</button>
      <button class="link" id="btn-open-canvas">Abrir Canvas</button>
    </footer>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
