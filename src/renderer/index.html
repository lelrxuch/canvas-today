<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Canvas Today</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="panel">
      <header class="titlebar">
        <div class="lights">
          <button class="light close" id="btn-close" data-i18n-title="btn.hide">
            <svg viewBox="0 0 12 12"><path d="M3.5 3.5l5 5M8.5 3.5l-5 5" /></svg>
          </button>
          <button class="light min" id="btn-min" data-i18n-title="btn.minimize">
            <svg viewBox="0 0 12 12"><path d="M3 6h6" /></svg>
          </button>
          <button class="light pin" id="btn-pin">
            <svg viewBox="0 0 12 12"><path d="M6 3v6M3 6h6" /></svg>
          </button>
        </div>
        <div class="title" id="title" data-i18n="title.list"></div>
        <div class="tools">
          <button class="tool" id="btn-refresh" data-i18n-title="btn.refresh">
            <svg viewBox="0 0 20 20"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.2h-3.2" /></svg>
          </button>
          <button class="tool" id="btn-settings" data-i18n-title="btn.settings">
            <svg viewBox="0 0 20 20">
              <circle cx="10" cy="10" r="2.6" />
              <path
                d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"
              />
            </svg>
          </button>
        </div>
      </header>

      <section class="view" id="view-list">
        <div class="summary" id="summary"></div>
        <div class="banner" id="banner" hidden>
          <span id="banner-text"></span>
          <button class="banner-btn" id="banner-btn" hidden></button>
        </div>
        <div class="list" id="list"></div>
      </section>

      <section class="view settings" id="view-settings" hidden>
        <form id="form" autocomplete="off">
          <h2 class="group-title" data-i18n="settings.connection"></h2>
          <div class="group">
            <label class="row stacked">
              <span class="label" data-i18n="settings.baseUrl"></span>
              <input type="text" name="baseUrl" placeholder="umg.instructure.com" spellcheck="false" />
            </label>
            <label class="row stacked">
              <span class="label" data-i18n="settings.loginPath"></span>
              <input type="text" name="loginPath" placeholder="/login/saml" spellcheck="false" />
            </label>
            <div class="row stacked">
              <span class="label" data-i18n="settings.token"></span>
              <span class="hint" id="token-status"></span>
              <input
                type="password"
                name="token"
                data-i18n-placeholder="settings.tokenPlaceholder"
                spellcheck="false"
              />
            </div>
            <label class="row">
              <span class="label" data-i18n="settings.tokenExpires"></span>
              <input type="date" name="tokenExpires" />
            </label>
          </div>

          <h2 class="group-title" data-i18n="settings.pending"></h2>
          <div class="group">
            <label class="row">
              <span class="label" data-i18n="settings.notifyHours"></span>
              <select name="notifyHours">
                <option value="1" data-i18n="unit.hours" data-i18n-arg="1"></option>
                <option value="3" data-i18n="unit.hours" data-i18n-arg="3"></option>
                <option value="6" data-i18n="unit.hours" data-i18n-arg="6"></option>
                <option value="12" data-i18n="unit.hours" data-i18n-arg="12"></option>
                <option value="24" data-i18n="unit.days" data-i18n-arg="1"></option>
              </select>
            </label>
            <label class="row">
              <span class="label" data-i18n="settings.daysAhead"></span>
              <select name="daysAhead">
                <option value="7" data-i18n="unit.days" data-i18n-arg="7"></option>
                <option value="14" data-i18n="unit.days" data-i18n-arg="14"></option>
                <option value="30" data-i18n="unit.days" data-i18n-arg="30"></option>
              </select>
            </label>
            <label class="row">
              <span class="label" data-i18n="settings.refreshMinutes"></span>
              <select name="refreshMinutes">
                <option value="5" data-i18n="unit.minutes" data-i18n-arg="5"></option>
                <option value="15" data-i18n="unit.minutes" data-i18n-arg="15"></option>
                <option value="30" data-i18n="unit.minutes" data-i18n-arg="30"></option>
                <option value="60" data-i18n="unit.hours" data-i18n-arg="1"></option>
              </select>
            </label>
          </div>

          <h2 class="group-title" data-i18n="settings.window"></h2>
          <div class="group">
            <div class="row">
              <span class="label" data-i18n="settings.theme"></span>
              <div class="segmented" role="radiogroup">
                <label
                  ><input type="radio" name="theme" value="system" /><span
                    data-i18n="settings.themeSystem"
                  ></span
                ></label>
                <label
                  ><input type="radio" name="theme" value="light" /><span
                    data-i18n="settings.themeLight"
                  ></span
                ></label>
                <label
                  ><input type="radio" name="theme" value="dark" /><span data-i18n="settings.themeDark"></span
                ></label>
              </div>
            </div>
            <label class="row">
              <span class="label" data-i18n="settings.opacity"></span>
              <input type="range" name="opacity" min="0.6" max="1" step="0.02" />
            </label>
            <label class="row">
              <span class="label" data-i18n="settings.alwaysOnTop"></span>
              <input type="checkbox" class="switch" name="alwaysOnTop" />
            </label>
            <label class="row">
              <span class="label" data-i18n="settings.autostart"></span>
              <input type="checkbox" class="switch" name="autostart" />
            </label>
          </div>

          <p class="form-error" id="form-error" hidden></p>

          <div class="form-actions">
            <button type="button" class="btn" id="btn-cancel" data-i18n="settings.cancel"></button>
            <button type="submit" class="btn primary" id="btn-save" data-i18n="settings.save"></button>
          </div>
          <button type="button" class="quit" id="btn-quit" data-i18n="settings.quit"></button>
        </form>
      </section>

      <footer class="footer">
        <span id="updated"></span>
        <span class="chip" id="token-chip" hidden></span>
        <button class="link" id="btn-login" data-i18n="footer.login"></button>
        <button class="link" id="btn-open-canvas" data-i18n="footer.openCanvas"></button>
      </footer>
    </div>
    <script src="i18n/es.js"></script>
    <script src="i18n/en.js"></script>
    <script src="agenda.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
